# Mosquitto config for the IS11 car (lab use only: no password).
# Windows:  "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
#   1883 = the car (plain MQTT)
#   9001 = tools/dashboard.html in the browser (MQTT over WebSocket)
listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
